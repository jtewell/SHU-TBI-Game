name: Build WebGL & Update Itch

on: [workflow_dispatch]

jobs:
  activation:
    name: Build the Game
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-SHUTBI-WebGL-v2-${{ github.sha }}
          restore-keys: |
            Library-SHUTBI-WebGL-v2-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4.3.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL

      - name: Verify WebGL Output
        run: |
          test -f build/WebGL/WebGL/index.html || {
            echo "::error::Expected build/WebGL/WebGL/index.html was not found."
            find build -maxdepth 5 -type f
            exit 1
          }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Build
          path: build
          if-no-files-found: error

      - name: Publish to Itch
        uses: josephbmanley/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.ITCH_TOKEN }}
          CHANNEL: html5
          ITCH_GAME: caed
          ITCH_USER: shu-gdd
          PACKAGE: build/WebGL/WebGL
